server.port=8080

# Spring Application Name
spring.application.name=hospital-op-backend

# Default Database Configuration (H2 in file-mode for immediate zero-config run)
spring.datasource.url=jdbc:h2:file:./data/hospital_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA & Hibernate properties
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Configuration
app.jwt.secret=HospitalOpSecretKeyForJwtAuthenticationMustBeAtLeast256BitsLongForHMACSHA256Security
app.jwt.expiration-ms=86400000

# File Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
